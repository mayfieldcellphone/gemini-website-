# =========================================================================
# High-Performance Nginx Configuration for Mayfield Phone Repair
# Domain: mayfieldphonerepair.com.au / www.mayfieldphonerepair.com.au
# Target: Ubuntu 22.04 LTS / Hostinger VPS with Sydney Edge Cloudflare CDN
# =========================================================================

# 1. HTTP -> HTTPS Redirect (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name mayfieldphonerepair.com.au www.mayfieldphonerepair.com.au;
    
    # ACME Challenge for Certbot SSL Renewal
    location /.well-known/acme-challenge/ {
        root /home/u479262663/domains/mayfieldphonerepair.com.au/public_html;
    }

    location / {
        return 301 https://mayfieldphonerepair.com.au$request_uri;
    }
}

# 2. WWW -> Non-WWW HTTPS Redirect (Canonicalization)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mayfieldphonerepair.com.au;

    ssl_certificate /etc/letsencrypt/live/mayfieldphonerepair.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayfieldphonerepair.com.au/privkey.pem;

    return 301 https://mayfieldphonerepair.com.au$request_uri;
}

# 3. Main Production Server (Non-WWW HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mayfieldphonerepair.com.au;

    root /home/u479262663/domains/mayfieldphonerepair.com.au/public_html;
    index index.html;

    # SSL Protocols & Ciphers
    ssl_certificate /etc/letsencrypt/live/mayfieldphonerepair.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayfieldphonerepair.com.au/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        font/woff2
        image/svg+xml;

    # Static Assets with Hash: 1-Year Immutable Caching
    # Vite bundles in /assets/ (e.g., index-_1x8d_8e.js, index-DOt4KkyO.css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static Media: Images, Icons, WebP, Fonts (30-day cache)
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # SEO and LLM Text: Never cache sitemap, robots, and llms.txt
    location ~* (robots\.txt|sitemap\.xml|llms\.txt)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Single Page Application (SPA) HTML Routing
    # Allows deep routes (/quote, /phone-repair/newcastle, etc.) to resolve to pre-rendered HTML or index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
