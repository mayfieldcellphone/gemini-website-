name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'bash /var/www/mayfield_update.sh'

          rm -f "$HOME/.ssh/deploy_key"
