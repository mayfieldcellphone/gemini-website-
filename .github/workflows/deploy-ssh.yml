name: Deploy to VPS (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build and restart on VPS
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'bash -lc "set -e; cd /var/www/mayfieldphonerepair.com.au && git pull origin main && npm ci && npm run build && pm2 restart mayfieldphonerepair && pm2 save"'
